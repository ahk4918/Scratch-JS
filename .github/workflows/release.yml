name: Build and Release Chrome Extension

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for RELEASE.md
        id: check
        run: |
          if [ -f RELEASE.md ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build extension (production)
        run: npm run build:prod

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Assemble Chrome extension package
        run: |
          rm -rf release-package
          mkdir -p release-package
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = require('./package.json').version;
            fs.writeFileSync('release-package/manifest.json', JSON.stringify(m, null, 2) + '\n');
          "
          cp -r dist release-package/dist
          test -f release-package/manifest.json
          cd release-package
          zip -r "../scratch-js-editor-chrome-v${{ steps.pkg.outputs.version }}.zip" .
          unzip -t "../scratch-js-editor-chrome-v${{ steps.pkg.outputs.version }}.zip"
          unzip -l "../scratch-js-editor-chrome-v${{ steps.pkg.outputs.version }}.zip" | grep -q '^.*manifest.json$'

      - name: Pack .crx
        run: |
          echo "${{ secrets.CRX_PRIVATE_KEY }}" > key.pem
          node scripts/pack-crx.js key.pem "scratch-js-editor-chrome-v${{ steps.pkg.outputs.version }}.zip" "scratch-js-editor-chrome-v${{ steps.pkg.outputs.version }}.crx"
          rm -f key.pem

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: v${{ steps.pkg.outputs.version }}
          body_path: RELEASE.md
          files: |
            scratch-js-editor-chrome-v${{ steps.pkg.outputs.version }}.zip
            scratch-js-editor-chrome-v${{ steps.pkg.outputs.version }}.crx

      - name: Clear RELEASE.md now that it's published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          if [ ! -f RELEASE.md ]; then
            echo "RELEASE.md was already cleared by another release run."
            exit 0
          fi
          git rm RELEASE.md
          git commit -m "chore: clear RELEASE.md after publishing v${{ steps.pkg.outputs.version }}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "Push raced with another commit; rebasing and retrying (attempt $((attempt + 1))/3)."
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
          done
          echo "Unable to push the RELEASE.md cleanup after 3 attempts."
          exit 1
