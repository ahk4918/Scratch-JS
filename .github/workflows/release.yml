name: Build and Release Chrome Extension

# Only does anything when RELEASE.md exists (see the job-level `if` below).
# That's also what stops this from looping: the last step deletes and
# commits RELEASE.md, that commit re-triggers this workflow, but by then
# RELEASE.md is gone so the job is skipped instead of re-running.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    if: hashFiles('RELEASE.md') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build extension (production)
        run: npm run build:prod

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Uses manifest.chrome.json (no Firefox-only browser_specific_settings
      # key) rather than the Firefox manifest.json, since this workflow
      # packages a Chrome build specifically. Its "version" field is synced
      # to package.json's here so the two never drift apart.
      - name: Assemble Chrome extension package
        run: |
          rm -rf release-package
          mkdir -p release-package
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.chrome.json', 'utf8'));
            m.version = require('./package.json').version;
            fs.writeFileSync('release-package/manifest.json', JSON.stringify(m, null, 2) + '\n');
          "
          cp -r dist release-package/dist
          cd release-package
          zip -r "../scratch-js-editor-chrome-v${{ steps.pkg.outputs.version }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: v${{ steps.pkg.outputs.version }}
          body_path: RELEASE.md
          files: scratch-js-editor-chrome-v${{ steps.pkg.outputs.version }}.zip

      - name: Clear RELEASE.md now that it's published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm RELEASE.md
          git commit -m "chore: clear RELEASE.md after publishing v${{ steps.pkg.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}
